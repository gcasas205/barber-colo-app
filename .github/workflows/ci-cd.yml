# CI/CD de barber-colo
# 1. checks: lint, tipos, tests y build en cada PR y en cada push a main.
# 2. deploy: solo si checks pasó. Preview en los PR, producción en main.
#    Vercel no despliega por su cuenta (vercel.json → git.deploymentEnabled: false):
#    lo que no pasa los tests nunca llega a Vercel.

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy a Vercel
    needs: checks
    # En PR de forks no hay acceso a los secretos: no se despliega.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }}
    steps:
      - name: Comprobar configuración de Vercel
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Faltan los secretos de Vercel (ver docs/ci-cd.md). Se omite el deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-node@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar Vercel CLI
        if: steps.config.outputs.enabled == 'true'
        run: npm install --global vercel@latest

      - name: Traer configuración del proyecto
        if: steps.config.outputs.enabled == 'true'
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Build para Vercel
        if: steps.config.outputs.enabled == 'true'
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        if: steps.config.outputs.enabled == 'true'
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "### Deploy $VERCEL_ENV listo" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
